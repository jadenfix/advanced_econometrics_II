name: Public research E2E
on: [push, pull_request, workflow_dispatch]
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-survival
      - run: Rscript run_public_research.R
